name: Threads general posts

# Posts the next ready-written post (no link, no model call) from
# threads/posts.csv, between the daily affiliate posts. Setup: threads/README.md

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 20:00 KST, every day
    - cron: '0 0 * * 1,3,5' # 00:00 UTC = 09:00 KST, Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: show the next post but do not publish it'
        type: boolean
        default: true

permissions:
  contents: write # commit threads/posts.csv.state (the rotation position)

concurrency:
  group: threads-post # shared with the affiliate workflow so state commits never race
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install and build the CLI
        run: |
          npm ci -w cli --no-audit --no-fund
          npm run build -w cli

      - name: Post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ -f threads/posts.csv ] || { echo "::error::threads/posts.csv is missing."; exit 1; }
          args=(threads-post --posts threads/posts.csv)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node cli/dist/index.js "${args[@]}"

      - name: Save rotation position
        if: inputs.dry_run != true
        run: |
          git add threads/posts.csv.state
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'threads: advance general post rotation [skip ci]'
          git pull --rebase
          git push
